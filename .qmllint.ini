[General]
MaxWarnings=0

[Warnings]
# Quickshell 0.3.0's generated qmltypes omit QProcess::ExitStatus and
# I3IpcEvent, and mark the documented/working PanelWindow as uncreatable.
# Runtime coverage exercises both APIs until the normative 0.3.1 package is
# available in the reference environment.
BadSignalHandlerParameters=disable
UncreatableType=disable
ImportFailure=error
Deprecated=error
MissingProperty=error
IncompatibleType=error
UnqualifiedAccess=error
UnresolvedType=error
RequiredProperty=error
DuplicatedName=error
